<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>아이젠트리 · 가격표 관리자 V2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="gate__box" id="gate-form" autocomplete="off">
    <div class="brand"><i><svg viewBox="0 0 24 24"><circle cx="7" cy="13" r="4.2"/><circle cx="17" cy="13" r="4.2"/><path d="M11.2 12.2c.5-.5 1.1-.5 1.6 0M2.8 12L4 7M21.2 12L20 7"/></svg></i><div><b>가격표 관리자</b><span>ADMIN</span></div></div>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input id="gate-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호">
    <div class="gate__err" id="gate-err"></div>
    <button class="btn btn--p" type="submit">들어가기</button>
    <a class="gate__back" href="index.html">← 가격표로 돌아가기</a>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand"><i><svg viewBox="0 0 24 24"><circle cx="7" cy="13" r="4.2"/><circle cx="17" cy="13" r="4.2"/><path d="M11.2 12.2c.5-.5 1.1-.5 1.6 0M2.8 12L4 7M21.2 12L20 7"/></svg></i><div><b>가격표 관리자</b><span>ADMIN · V2</span></div></div>
    <nav class="cats" id="nav"></nav>
    <div class="tools" style="grid-template-columns:repeat(2,1fr)">
      <a class="tool" href="index.html" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>가격표 열기</span></a>
      <button class="tool" id="btn-logout"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg><span>잠금</span></button>
    </div>
  </aside>
  <section class="stage">
    <header class="stage__head adm-head" id="head"></header>
    <div class="adm-view" id="view"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="scrim scrim--top" id="scrim2" hidden><div class="sheet sheet--s" id="sheet2" role="dialog" aria-modal="true"></div></div>
<div class="pill" id="pill" hidden></div>
<script src="admin.js"></script>
</body>
</html>
